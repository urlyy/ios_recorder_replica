<html lang="zh-CN">

  <meta name="color-scheme" content="light">

<body>

    </defs>
  </svg>
  <main class="screen" aria-label="语音备忘录">
    <div class="statusbar" aria-hidden="true">
      <div class="status-left">
        <span>16:17</span>
        <svg class="silent-icon" viewBox="0 0 18 20">
          <path d="M5.4 3.2A5.1 5.1 0 0 1 9 1.8c3.1 0 5.2 2.4 5.2 5.7v3l2 2.8c.5.7.1 1.6-.8 1.6h-1.1ZM3.8 6.2v4.3l-2 2.8c-.5.7-.1 1.6.8 1.6h8.9ZM6.7 16.6h4.6a2.4 2.4 0 0 1-4.6 0Z"></path>
          <path d="m1.8 1.6 14.5 16.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
      </div>
      <div class="dynamic-island"><span class="screen-recording-dot"></span></div>
      <div class="status-icons">
        <svg class="cellular-icon" viewBox="0 0 21 15">
          <rect x="0" y="5" width="3.3" height="5.7" rx="1.1"></rect><rect x="5.4" y="4" width="3.3" height="6.7" rx="1.1"></rect><rect x="10.8" y="2" width="3.3" height="8.7" rx="1.1"></rect><rect x="16.2" y="0" width="3.3" height="10.7" rx="1.1"></rect>
          <rect x="0" y="12" width="3.3" height="3" rx="1"></rect><rect x="5.4" y="12" width="3.3" height="3" rx="1"></rect><rect x="10.8" y="12" width="3.3" height="3" rx="1"></rect><rect x="16.2" y="12" width="3.3" height="3" rx="1"></rect>
        </svg>
        <svg class="wifi-icon" viewBox="0 0 18 14">
          <path d="M.4 4.5a12.5 12.5 0 0 1 17.2 0c.2.2.2.4 0 .6L16 6.6c-.2.2-.4.2-.6 0a9.5 9.5 0 0 0-12.8 0c-.2.2-.4.2-.6 0L.4 5.1c-.2-.2-.2-.4 0-.6ZM3.4 7.6a8.1 8.1 0 0 1 11.2 0c.2.2.2.4 0 .6L13 9.8c-.2.2-.4.2-.6 0a4.9 4.9 0 0 0-6.8 0c-.2.2-.4.2-.6 0L3.4 8.2c-.2-.2-.2-.4 0-.6ZM6.5 10.7a3.7 3.7 0 0 1 5 0c.2.2.2.4 0 .6L9.3 13.5c-.2.2-.4.2-.6 0l-2.2-2.2c-.2-.2-.2-.4 0-.6Z"></path>
        </svg>
        <span class="battery"><span class="battery-level"></span><span class="battery-number">78</span></span>
      </div>
    </div>
    <section class="recording-sheet" aria-label="录音播放">
      <div class="handle" aria-hidden="true"></div>
      <nav class="top-tools" aria-label="录音操作">
        <button id="more" class="glass-button" aria-label="更多操作" title="更多操作" disabled><i data-lucide="ellipsis" aria-hidden="true"></i></button>
        <button id="done" class="glass-button done-button" aria-label="完成" title="完成" disabled><i data-lucide="check" aria-hidden="true"></i></button>
      </nav>
      <header>
        <h1 id="title">电话录音</h1>
        <p><span id="date">2026年5月11日</span><span id="duration">0:00</span></p>
      </header>
      <div class="wave-area">
        <canvas id="waveform" role="img" aria-label="录音波形"></canvas>
        <div class="cursor" aria-hidden="true"></div>
      </div>
      <div class="times"><span id="elapsed">00:00.00</span></div>
      <div id="error" class="sr-only" role="status"></div>
      <div class="controls">
        <button id="back" aria-label="后退15秒" title="后退15秒" disabled><svg class="skip-icon" viewBox="0 0 32 36" aria-hidden="true"><path d="M16 8a12 12 0 1 1-8.3 3.3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path><path d="m17 1.8-7.4 5.4a.9.9 0 0 0 0 1.4L17 14c.7.5 1.4.1 1.4-.7V2.5c0-.8-.7-1.2-1.4-.7Z" fill="currentColor"></path><use href="#skip-fifteen" transform="translate(8.05 0)" fill="currentColor"></use></svg></button>
        <button id="play" aria-label="播放" title="播放" disabled><i data-lucide="play" aria-hidden="true"></i></button>
        <button id="forward" aria-label="快进15秒" title="快进15秒" disabled><svg class="skip-icon" viewBox="0 0 32 36" aria-hidden="true"><g transform="translate(32 0) scale(-1 1)"><path d="M16 8a12 12 0 1 1-8.3 3.3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path><path d="m17 1.8-7.4 5.4a.9.9 0 0 0 0 1.4L17 14c.7.5 1.4.1 1.4-.7V2.5c0-.8-.7-1.2-1.4-.7Z" fill="currentColor"></path></g><use href="#skip-fifteen" transform="translate(8.05 0)" fill="currentColor"></use></svg></button>
      </div>
      <div class="bottom-tools">
        <button id="transcript" class="glass-button" aria-label="转写文本" title="转写文本" disabled><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><path d="M5.3 3.1h15.4a3.2 3.2 0 0 1 3.2 3.2v10a3.2 3.2 0 0 1-3.2 3.2h-9.5l-5.5 4.1v-4.1h-.4a3.2 3.2 0 0 1-3.2-3.2v-10a3.2 3.2 0 0 1 3.2-3.2Z"></path><path d="M9.4 8a2 2 0 1 0 .2 4c-.2.9-.7 1.5-1.5 2l.6.7c2.4-1.2 3-2.9 2.8-4.4A2.1 2.1 0 0 0 9.4 8Zm6.3 0a2 2 0 1 0 .2 4c-.2.9-.7 1.5-1.5 2l.6.7c2.4-1.2 3-2.9 2.8-4.4A2.1 2.1 0 0 0 15.7 8Z" fill="currentColor" stroke="none"></path></svg></button>
        <button id="replace" class="glass-button replace-button" aria-label="替换录音" title="替换" disabled>替换</button>
        <button id="settings" class="glass-button settings-button" aria-label="播放设置" title="播放设置" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M2 5h12m4 0h4M2 12h4m4 0h12M2 19h12m4 0h4"></path><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button>
      </div>
    </section>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="./icons.js"></script>
  <script src="./app.js"></script>
</body>
</html>
